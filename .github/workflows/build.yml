name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Format
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          gofmt -d .
          exit 1
        fi

    - name: Test
      run: go test -race -v ./...
